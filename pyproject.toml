[project]
name = "chat-autotimeout-engine"
version = "0.1.0"
description = "Livestream chat moderation pipeline and a grammar-constrained decoding lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "streamlit>=1.33",
    "openai>=1.40",
    "google-genai>=1.0",
    "huggingface_hub>=0.26",
    "llama-cpp-python>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chat-moderate = "src.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
